
<codeblock><!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Ordem de Serviço</title>
    <link rel="stylesheet" href="desing.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }

        h1, h2 {
            text-align: center;
        }

        .empresa {
            text-align: center;
            margin-bottom: 30px;
        }

        .dados label {
            display: inline-block;
            width: 150px;
            font-weight: bold;
        }

        .dados input {
            width: 300px;
            margin-bottom: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        table, th, td {
            border: 1px solid #000;
        }

        th, td {
            padding: 6px;
            text-align: center;
        }

        input[type="number"] {
            width: 80px;
        }

        .btn {
            margin-top: 10px;
            padding: 8px 15px;
            cursor: pointer;
        }

        .total-geral {
            text-align: right;
            font-size: 18px;
            font-weight: bold;
            margin-top: 20px;
            margin-bottom: 15px;
        }

        .total-geral input[type="number"] {
            width: 120px;
            font-size: 18px;
            font-weight: bold;
            text-align: right;
            border: none;
            background-color: transparent;
        }

        textarea {
            width: 100%;
            min-height: 80px;
            box-sizing: border-box;
            resize: vertical;
        }

        @media print {
            .btn-print-hide {
                display: none;
            }
        }
    </style>

    <!-- Biblioteca html2pdf -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>

<div class="empresa">
    <h1>Silfer Serralheria</h1>
</div>

<div class="dados">
    <p><label>Nome:</label><input type="text"></p>
    <p><label>Endereço 1:</label><input type="text"></p>
    <p><label>Endereço de Cobrança:</label><input type="text"></p>
    <p><label>CNPJ/CPF:</label><input type="text"></p>
    <p><label>Telefone:</label><input type="text"></p>
</div>

<h2>Produtos / Serviços</h2>

<table id="tabela">
    <thead>
        <tr>
            <th>Qtd</th>
            <th>Descrição</th>
            <th>Valor Unit</th>
            <th>Total</th>
        </tr>
    </thead>
    <tbody>
        <tr>
            <td><input type="number" value="1" oninput="calcular(this)"></td>
            <td><textarea rows="4"></textarea></td>
            <td><input type="number" value="0.00" step="0.01" oninput="calcular(this)"></td>
            <td><input type="number" value="0.00" step="0.01" oninput="calcular(this)"></td>
        </tr>
    </tbody>
</table>

<button class="btn btn-print-hide" onclick="adicionarLinha()">➕ Adicionar Produto</button>

<div class="total-geral">
    Total Geral: R$
    <input
        type="number"
        id="totalGeralInput"
        value="0.00"
        step="0.01"
        oninput="marcarTotalGeralEditado()">
</div>

<button class="btn btn-print-hide" onclick="gerarPdf()">Salvar como PDF</button>

<script>
let totalGeralManualOverride = false;

function marcarTotalGeralEditado() {
    totalGeralManualOverride = true;
}

function adicionarLinha() {
    const tabelaBody = document.querySelector("#tabela tbody");
    const novaLinha = tabelaBody.insertRow();

    novaLinha.innerHTML = `
        <td><input type="number" value="1" oninput="calcular(this)"></td>
        <td><textarea rows="4"></textarea></td>
        <td><input type="number" value="0.00" step="0.01" oninput="calcular(this)"></td>
        <td><input type="number" value="0.00" step="0.01" oninput="calcular(this)"></td>
    `;

    totalGeralManualOverride = false;
    calcular();
}

function calcular(elementoModificado) {
    const linhas = document.querySelectorAll("#tabela tbody tr");
    let somaLinhas = 0;

    linhas.forEach(linha => {
        const qtdInput = linha.cells[0].querySelector("input");
        const unitInput = linha.cells[2].querySelector("input");
        const totalLinhaInput = linha.cells[3].querySelector("input");

        let qtd = parseFloat(qtdInput.value) || 0;
        let unit = parseFloat(unitInput.value) || 0;
        let totalLinha = qtd * unit;

        totalLinhaInput.value = totalLinha.toFixed(2);
        somaLinhas += totalLinha;
    });

    if (!totalGeralManualOverride) {
        document.getElementById("totalGeralInput").value = somaLinhas.toFixed(2);
    }
}

function gerarPdf() {
    const element = document.body.cloneNode(true);
    element.querySelectorAll('.btn-print-hide').forEach(btn => btn.remove());

    const options = {
        margin: 10,
        filename: 'ordem_de_servico.pdf',
        image: { type: 'jpeg', quality: 0.98 },
        html2canvas: { scale: 2 },
        jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
    };

    html2pdf().set(options).from(element).save();
}

window.onload = calcular;
</script>

</body>
</html></codeblock>
